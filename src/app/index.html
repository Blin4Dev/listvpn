<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>%LISTVPN_BRAND%</title>
    <!-- Mini App vs сайт: не ждать telegram.org (в РФ часто не грузится) — hash/WebView уже есть -->
    <script>
      (function () {
        try {
          var h = String(location.hash || "");
          var s = String(location.search || "");
          var tg = window.Telegram && window.Telegram.WebApp;
          var mini = !!(tg && tg.initData) || /tgWebAppData=/.test(h + s) || /tgWebAppPlatform=/.test(h + s)
            || !!window.TelegramWebviewProxy || !!window.TelegramWebview;
          if (mini) window.__BLIN_TG_MINIAPP__ = true;
        } catch (e) {}
      })();
    </script>
    <!-- Официальный SDK Telegram Mini Apps: initData, expand(), requestFullscreen() -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: %LISTVPN_PAGE_BG%; }
      #blin-boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: %LISTVPN_BOOT_BG%;
        /* как pageFrame: логотип в масштабе макета 402, иначе скачок в React */
        padding: 0;
        box-sizing: border-box;
      }
      #blin-boot img {
        width: calc(min(200px, 42vh) * var(--blin-scale, 1));
        height: calc(min(200px, 42vh) * var(--blin-scale, 1));
        max-width: calc(200px * var(--blin-scale, 1));
        max-height: calc(200px * var(--blin-scale, 1));
        object-fit: contain;
      }
    </style>
    <script>
      (function () {
        var w = window.innerWidth || 402;
        document.documentElement.style.setProperty("--blin-scale", String(Math.min(1, w / 402)));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="blin-boot"></div>
%LISTVPN_BOOT_PRELOAD%    <!-- Vite root теперь src/app, поэтому путь локальный -->
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
