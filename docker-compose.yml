# listvpn — сеть VPN-проектов (BatmanVPN, FGN …) на одном бэкенде: оркестрация сервисов
# проекты: projects/<id>/ (см. projects/README.md); бот один на все проекты (опрашивает ботов всех проектов)
# api/webhook/bot в network_mode host (remnawave :3000, caddy на хосте → 127.0.0.1)
# miniapp/panel: spa на 127.0.0.1:{9741,9742}

# ротация docker-логов: 50мб × 3 файла
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-python-build: &python-build
  build:
    context: .
    dockerfile: docker/Dockerfile.python
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  env_file: .env
  environment:
    DB_PATH: /app/data/data.db
    PROJECTS_DIR: /app/projects
  volumes:
    - ./data:/app/data
    # реестр проектов (project.json) — без пересборки образа
    - ./projects:/app/projects:ro
  restart: unless-stopped
  network_mode: host
  logging: *default-logging

services:
  api:
    <<: *python-build
    container_name: blinvpn-api
    command: >
      uvicorn core:app --host 127.0.0.1 --port ${API_PORT:-8000}
      --forwarded-allow-ips 127.0.0.1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:%s/api/health' % os.getenv('API_PORT','8000'), timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  webhook:
    <<: *python-build
    container_name: blinvpn-webhook
    command: >
      uvicorn webhook:app --host 127.0.0.1 --port ${WEBHOOK_PORT:-5000}
      --forwarded-allow-ips 127.0.0.1
    depends_on:
      - api

  bot:
    <<: *python-build
    container_name: blinvpn-bot
    command: python /app/src/bot/bot.py
    depends_on:
      - api

  # мониторинг серверов (blinmon, ping, vless, инциденты)
  monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: blinvpn-monitor
    env_file: .env
    environment:
      DB_PATH: /app/data/data.db
      PROJECTS_DIR: /app/projects
    volumes:
      - ./data:/app/data
      - ./projects:/app/projects:ro
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    depends_on:
      - api

  # мини-приложения ВСЕХ проектов: Caddy на хосте ставит X-Project по домену проекта
  miniapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.miniapp
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: blinvpn-miniapp
    restart: unless-stopped
    logging: *default-logging
    environment:
      DEFAULT_PROJECT: ${DEFAULT_PROJECT:-batman}
    ports:
      - "127.0.0.1:${MINIAPP_PORT:-9741}:80"
    # живые картинки: projects/<id>/assets поверх общих assets/ (ro)
    volumes:
      - ./assets:/srv/live/shared/assets:ro
      - ./projects:/srv/live/projects:ro

  panel:
    build:
      context: .
      dockerfile: docker/Dockerfile.panel
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: blinvpn-panel
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${PANEL_PORT:-9742}:80"
    # живой mount assets/ (ro)
    volumes:
      - ./assets:/srv/live/assets:ro
