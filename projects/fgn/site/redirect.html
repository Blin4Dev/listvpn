<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#050505" />
  <title>BatmanVPN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* палитра и фон FGN (projects/fgn/app/components/fgn.tsx): сетка 48px, частицы, листья, белая кнопка */
    :root {
      color-scheme: dark;
      --bg: #050505;
      --text: #FFFFFF;
      --muted: rgba(196, 196, 206, 0.78);
      --grid: rgba(255, 255, 255, 0.13);
      --green: #34D67C;
      --btn: #F2F2F3;
      --btn-text: #0A0A0A;
      --font: 'Onest', 'Outfit', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    .backdrop {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      background-color: var(--bg);
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px; background-position: center center;
    }
    .backdrop::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(5,5,5,0) 0%, rgba(5,5,5,.35) 50%, rgba(5,5,5,.92) 100%);
    }
    .p { position: absolute; transform: translate(-50%, -50%); animation: fgnFloat var(--t, 8s) ease-in-out var(--d, 0s) infinite; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 6px 2px rgba(255,255,255,.9), 0 0 18px 6px rgba(255,255,255,.35);
      animation: fgnTwinkle 5s ease-in-out var(--d, 0s) infinite; }
    .dot.g { width: 6px; height: 6px; background: #5BF29A;
      box-shadow: 0 0 6px 2px rgba(52,214,124,.9), 0 0 18px 6px rgba(52,214,124,.35); }
    .leaf { display: block; width: 22px; height: 22px; filter: drop-shadow(0 0 8px rgba(52,214,124,.55)); }
    @keyframes fgnFloat {
      0%, 100% { transform: translate(-50%, -50%) translate(0, 0); }
      33% { transform: translate(-50%, -50%) translate(5px, -7px); }
      66% { transform: translate(-50%, -50%) translate(-4px, 4px); }
    }
    @keyframes fgnTwinkle { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .p, .dot, .icon { animation: none !important; } }
    .screen {
      position: relative; z-index: 1; min-height: 100%;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 24px 22px calc(28px + env(safe-area-inset-bottom));
      max-width: 460px; margin: 0 auto;
    }
    .icon {
      width: 72px; height: 72px; border-radius: 20px; overflow: hidden;
      box-shadow: 0 16px 40px -14px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.1); margin-bottom: 22px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .done .icon { animation: none; }
    @keyframes pulse { 50% { transform: scale(.94); opacity: .8; } }
    h1 { margin: 0; font-size: 34px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.1; }
    .sub { margin: 10px 0 30px; font-size: 16px; line-height: 1.45; color: var(--muted); }
    .btn {
      display: flex; align-items: center; justify-content: center; width: 100%; height: 56px;
      border-radius: 24px; background: var(--btn); color: var(--btn-text); text-decoration: none;
      font-family: var(--font); font-size: 17px; font-weight: 500; letter-spacing: -0.01em;
      box-shadow: 0 14px 38px -14px rgba(52, 214, 124, .55);
      transition: transform .12s ease, opacity .12s ease;
    }
    .btn:active { transform: scale(.98); opacity: .9; }
    .links { display: flex; justify-content: center; gap: 22px; margin-top: 18px; opacity: 0; transition: opacity .3s ease; }
    .done .links { opacity: 1; }
    .links a, .links button {
      background: none; border: 0; padding: 6px 2px; cursor: pointer;
      font-family: var(--font); font-size: 14.5px; color: var(--muted); text-decoration: none;
    }
    .links a:active, .links button:active { color: var(--green); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="p" style="left:4.6%;top:5.7%;--d:0s;--t:7s"><div class="dot"></div></div>
    <div class="p" style="left:86.2%;top:11.4%;--d:-1.2s;--t:8s"><div class="dot"></div></div>
    <div class="p" style="left:12.3%;top:34.1%;--d:-2.1s;--t:6.5s"><div class="dot"></div></div>
    <div class="p" style="left:95.4%;top:39.8%;--d:-0.6s;--t:7.5s"><div class="dot"></div></div>
    <div class="p" style="left:6.2%;top:73.9%;--d:-1.8s;--t:8.5s"><div class="dot"></div></div>
    <div class="p" style="left:49.2%;top:85.3%;--d:-0.3s;--t:7s"><div class="dot"></div></div>
    <div class="p" style="left:24.6%;top:17.1%;--d:-0.9s;--t:6s"><div class="dot g"></div></div>
    <div class="p" style="left:61.5%;top:28.4%;--d:-2.4s;--t:7s"><div class="dot g"></div></div>
    <div class="p" style="left:73.8%;top:62.6%;--d:-1.5s;--t:6.5s"><div class="dot g"></div></div>
    <div class="p" style="left:92.3%;top:91%;--d:-0.2s;--t:8s"><div class="dot g"></div></div>
    <div class="p" style="left:10.3%;top:14.9%;--d:-0.4s;--t:9s"><div style="transform:rotate(-18deg)"><svg class="leaf" viewBox="0 0 24 24"><path d="M12 2.5C7 7.5 4.5 11.2 4.5 14.6a7.5 7.5 0 0 0 15 0C19.5 11.2 17 7.5 12 2.5Z" fill="#34D67C"/><path d="M13.6 9.2 10.2 18.6" stroke="#0B3B20" stroke-width="1.5" stroke-linecap="round"/></svg></div></div>
    <div class="p" style="left:83.6%;top:11.8%;--d:-2s;--t:10s"><div style="transform:rotate(24deg)"><svg class="leaf" viewBox="0 0 24 24"><path d="M12 2.5C7 7.5 4.5 11.2 4.5 14.6a7.5 7.5 0 0 0 15 0C19.5 11.2 17 7.5 12 2.5Z" fill="#34D67C"/><path d="M13.6 9.2 10.2 18.6" stroke="#0B3B20" stroke-width="1.5" stroke-linecap="round"/></svg></div></div>
    <div class="p" style="left:48.2%;top:25.4%;--d:-1.1s;--t:9.5s"><div style="transform:rotate(-8deg)"><svg class="leaf" viewBox="0 0 24 24"><path d="M12 2.5C7 7.5 4.5 11.2 4.5 14.6a7.5 7.5 0 0 0 15 0C19.5 11.2 17 7.5 12 2.5Z" fill="#34D67C"/><path d="M13.6 9.2 10.2 18.6" stroke="#0B3B20" stroke-width="1.5" stroke-linecap="round"/></svg></div></div>
    <div class="p" style="left:7.7%;top:72.9%;--d:-2.6s;--t:8.5s"><div style="transform:rotate(12deg)"><svg class="leaf" viewBox="0 0 24 24"><path d="M12 2.5C7 7.5 4.5 11.2 4.5 14.6a7.5 7.5 0 0 0 15 0C19.5 11.2 17 7.5 12 2.5Z" fill="#34D67C"/><path d="M13.6 9.2 10.2 18.6" stroke="#0B3B20" stroke-width="1.5" stroke-linecap="round"/></svg></div></div>
    <div class="p" style="left:89.7%;top:76.8%;--d:-0.7s;--t:9s"><div style="transform:rotate(-30deg)"><svg class="leaf" viewBox="0 0 24 24"><path d="M12 2.5C7 7.5 4.5 11.2 4.5 14.6a7.5 7.5 0 0 0 15 0C19.5 11.2 17 7.5 12 2.5Z" fill="#34D67C"/><path d="M13.6 9.2 10.2 18.6" stroke="#0B3B20" stroke-width="1.5" stroke-linecap="round"/></svg></div></div>
    <div class="p" style="left:59.7%;top:82%;--d:-1.6s;--t:10s"><div style="transform:rotate(20deg)"><svg class="leaf" viewBox="0 0 24 24"><path d="M12 2.5C7 7.5 4.5 11.2 4.5 14.6a7.5 7.5 0 0 0 15 0C19.5 11.2 17 7.5 12 2.5Z" fill="#34D67C"/><path d="M13.6 9.2 10.2 18.6" stroke="#0B3B20" stroke-width="1.5" stroke-linecap="round"/></svg></div></div>
  </div>
  <main class="screen" id="screen">
    <div class="icon"><img id="icon" alt="" /></div>
    <h1 id="title">Открываем приложение</h1>
    <p class="sub" id="sub">Подписка BatmanVPN добавится автоматически.</p>
    <a class="btn" id="go" href="#" rel="noopener">Открыть</a>
    <div class="links">
      <button type="button" id="copy" class="hidden">Скопировать ссылку</button>
      <a id="store" class="hidden" href="#" rel="noopener">Установить</a>
    </div>
  </main>
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var target = qs.get('url') || '';
      var appKey = (qs.get('app') || '').toLowerCase();
      var $ = function (id) { return document.getElementById(id); };

      // только схемы наших приложений (без open-redirect на сайты)
      var SCHEME = /^(incy|happ|koala-clash):\/\//i;
      var APPS = {
        incy: {
          name: 'Incy', icon: '/assets/incy.png', pkg: 'llc.itdev.incy',
          ios: 'https://apps.apple.com/ru/app/incy/id6756943388',
          android: 'https://play.google.com/store/apps/details?id=llc.itdev.incy'
        },
        'koala-clash': {
          name: 'Koala Clash', icon: '/assets/koala.png', desktop: true,
          store: 'https://github.com/coolcoala/koala-clash/releases/latest'
        },
        happ: {
          name: 'Happ', icon: '/assets/happ.png', pkg: 'com.happproxy',
          ios: 'https://apps.apple.com/ru/app/happ-proxy-utility-plus/id6746188973',
          android: 'https://play.google.com/store/apps/details?id=com.happproxy'
        }
      };

      if (!SCHEME.test(target)) {
        $('screen').classList.add('done');
        $('icon').parentNode.classList.add('hidden');
        $('title').textContent = 'Ссылка недействительна';
        $('sub').textContent = 'Вернитесь в BatmanVPN и попробуйте ещё раз.';
        $('go').classList.add('hidden');
        return;
      }
      if (appKey === 'koala') appKey = 'koala-clash';
      if (!APPS[appKey]) appKey = target.split(':')[0].toLowerCase();
      var meta = APPS[appKey] || APPS.incy;

      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);

      // Android: intent:// открывает приложение надёжнее, без приложения — Google Play
      var primary = target;
      if (isAndroid && !meta.desktop) {
        var m = /^([a-z]+):\/\/(.*)$/i.exec(target);
        if (m) primary = 'intent://' + m[2] + '#Intent;scheme=' + m[1] + ';package=' + meta.pkg +
          ';S.browser_fallback_url=' + encodeURIComponent(meta.android) + ';end';
      }

      $('icon').src = meta.icon;
      $('title').textContent = 'Открываем ' + meta.name;
      var go = $('go');
      go.textContent = 'Открыть ' + meta.name;
      go.setAttribute('href', primary);

      var store = meta.desktop ? meta.store : (isIOS ? meta.ios : (isAndroid ? meta.android : ''));
      if (store) {
        var st = $('store');
        st.href = store;
        st.textContent = 'Установить ' + meta.name;
        st.classList.remove('hidden');
      }
      var plain = (/^(?:incy|happ):\/\/(?:add|import)\/(https?:\/\/.+)$/i.exec(target) || [])[1];
      // Koala Clash: koala-clash://install-config?url=<подписка> — её же можно вставить в приложение вручную
      if (!plain && /^koala-clash:/i.test(target)) {
        try { plain = new URL(target.replace(/^koala-clash:/i, 'https:')).searchParams.get('url') || ''; } catch (e) { plain = ''; }
        if (!/^https?:\/\//i.test(plain)) plain = '';
      }
      if (plain && navigator.clipboard) {
        var cp = $('copy');
        cp.classList.remove('hidden');
        cp.addEventListener('click', function () {
          navigator.clipboard.writeText(plain).then(function () { cp.textContent = 'Скопировано'; }, function () {});
        });
      }

      // приложение открылось → страница ушла в фон
      var left = false;
      document.addEventListener('visibilitychange', function () { if (document.hidden) left = true; });
      window.addEventListener('pagehide', function () { left = true; });

      // пробуем открыть сразу; встроенный браузер Telegram на iOS это блокирует — тогда нужна кнопка
      try { window.location.href = primary; } catch (e) {}
      setTimeout(function () {
        $('screen').classList.add('done');
        if (!left) {
          $('title').textContent = 'Добавьте подписку';
          $('sub').textContent = isIOS
            ? 'Нажмите кнопку и разрешите открыть ' + meta.name + '.'
            : 'Нажмите кнопку — подписка добавится в ' + meta.name + '.';
        }
      }, 1500);
    })();
  </script>
</body>
</html>
